<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graffiti Runner 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-overlay" class="overlay">
    <div class="loading-panel">
      <h1>Loading World</h1>
      <div id="loading-label">Starting 0%</div>
      <div class="loading-progress-track">
        <div id="loading-progress-fill" class="loading-progress-fill"></div>
      </div>
    </div>
  </div>

  <div id="instructions-overlay" class="overlay intro-overlay">
    <div class="intro-content">
      <img src="assets/instructionstitle.png" alt="Instructions" class="intro-title" />
      <img src="assets/instructions.png" alt="How to Play" class="intro-sheet" />
      <button id="start-game-button" class="primary-button">Start Session</button>
    </div>
  </div>

  <div id="hud-root">
    <div id="crosshair"></div>

    <div class="hud-block controls-block">
      <img src="assets/controlstitle.png" alt="Controls" class="controls-title" />
      <img src="assets/controls.png" alt="Control Layout" class="controls-image" />
    </div>

    <div id="connection-status" class="hud-chip disconnected">Offline</div>

    <div id="draw-prompt" class="draw-prompt">Press E to paint</div>

    <div id="draw-hud" class="draw-hud">
      <div class="draw-row">
        <label for="stroke-color">Color</label>
        <input id="stroke-color" type="color" value="#ff3d3d" />
      </div>
      <div class="draw-row">
        <label for="stroke-size">Thickness</label>
        <input id="stroke-size" type="range" min="1" max="24" value="6" />
        <span id="stroke-size-value">6px</span>
      </div>
      <div class="draw-row tool-row">
        <button id="tool-brush" class="tool-button active">Brush</button>
        <button id="tool-erase" class="tool-button">Erase</button>
      </div>
    </div>

    <div id="debug-panel" class="debug-panel">FPS 0 | Draw 0 | Triangles 0 | Memory n/a</div>
  </div>

  <script>
    window.__graffitiBoot = { started: false };
    setTimeout(() => {
      if (window.__graffitiBoot?.started) {
        return;
      }
      const loadingLabel = document.getElementById('loading-label');
      const loadingFill = document.getElementById('loading-progress-fill');
      const loadingPanel = document.querySelector('.loading-panel');
      if (loadingFill) {
        loadingFill.style.width = '100%';
      }
      if (loadingPanel) {
        loadingPanel.classList.add('boot-error');
      }
      if (loadingLabel) {
        loadingLabel.textContent = 'Startup failed. Run `npm start` in graffiti-game and open http://127.0.0.1:3000/public/index.html';
      }
      console.error('Bootstrap timeout: startup failed after 8s');
    }, 8000);
  </script>
  <script src="dist/app.js?v=20260422-livepreview"></script>
</body>
</html>
