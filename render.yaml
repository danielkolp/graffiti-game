services:
  - type: web
    name: 3dchar-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false  # This means you'll set it manually in the Render dashboard
      - key: DRAWINGS_DIR
        value: /var/data/drawings  # Persistent storage path
    disk:
      name: drawings-data
      mountPath: /var/data
      sizeGB: 1
